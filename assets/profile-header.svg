<desc id="desc">Minimal charcoal developer profile banner with lime accents, grid, and LY monogram.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#141E2B"/><stop offset="1" stop-color="#0B1119"/></linearGradient>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#617187" stroke-width=".5" opacity=".13"/></pattern>
